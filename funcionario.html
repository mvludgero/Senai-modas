<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SENAI MODAS - Cadastro Funcionários</title>
    <link rel="stylesheet" href="funcionario.css">
</head>
<body>
    <div class="geral">
        <h1>Cadastro de Funcionários</h1>
        <input type="text" placeholder="Nome" name="nome" id="txtnome">
        <input type="text" placeholder="CPF" name="cpf" id="txtcpf">
        <input type="text" placeholder="Email" name="email" id="txtemail">
        <input type="text" placeholder="Endereco" name="endereco" id="txtendereco">
        <input type="text" placeholder="Sexo" name="sexo" id="txtsexo">
        <input type="text" placeholder="Telefone" name="telefone" id="txttelefone">
        <input type="text" placeholder="Data de Nascimento" name="data_nascimento" id="txtdatanascimento">
        <input type="text" placeholder="Data de Admissão " name="data_admissao" id="txtdataadmissao">
        <input type="text" placeholder="Cargo" name="cargo" id="txtcargo">
        <input type="text" placeholder="Salário" name="salario" id="txtsalario"><br>
        <button type="button" class="cadastrar">Cadastrar</button>
         <button type="button" class="alterar">Alterar</button>
          <button type="button" class="excluir">Excluir</button>
    </div>
</body>
</html>

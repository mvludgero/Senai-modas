<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SENAI MODAS - Cadastro de Produtos</title>
    <style>
        /* Reset e fonte */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Arial, Helvetica, sans-serif;
        }

        /* Fundo animado */
        body {
            background: linear-gradient(
                135deg,
                #1f6fb2 0%,     
                #05275a 35%,    
                #0084ff 65%,    
                #0d0179 100%
            );
            background-size: 400% 400%;
            animation: fundo 10s ease infinite;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        @keyframes fundo {
            0% { background-position:0% 50%; }
            50% { background-position:100% 50%; }
            100% { background-position:0% 50%; }
        }

        /* Container centralizado */
        .container {
            background-color: rgba(255, 255, 255, 0.85);
            padding: 40px 50px;
            width: 600px;
            border-radius: 30px;
            box-shadow: 0 0 20px #00000050;
        }

        h1 {
            color: #000000;
            text-align: center;
            margin-bottom: 30px;
            font-size: 28pt;
            font-weight: bold;
        }

        form {
            display: flex;
            flex-direction: column;
        }

        input, textarea {
            padding: 10px;
            border: 2px solid rgb(15, 0, 148);
            border-radius: 10px;
            outline: none;
            margin-bottom: 20px;
            font-size: 14pt;
            color: #12098d;
            background-color: rgba(255, 255, 255, 0.7);
        }

        input::placeholder, textarea::placeholder {
            color: #6d6d6dd3;
            font-weight: bold;
            font-style: italic;
        }

        textarea {
            resize: none;
            height: 100px;
        }

        input[type="submit"] {
            background-color: rgb(0, 65, 187);
            color: white;
            border: none;
            font-size: 14pt;
            font-weight: bold;
            cursor: pointer;
            transition: 0.3s;
        }

        input[type="submit"]:hover {
            background-color: #0a68c0;
        }

        /* Link de voltar */
        .inicio {
            position: absolute;
            top: 20px;
            left: 20px;
            font-size: 50px;
        }

        .inicio a {
            text-decoration: none;
            color: #0a7cff;
        }

        /* Scrollbar personalizada */
        ::-webkit-scrollbar {
            width: 10px;
        }

        ::-webkit-scrollbar-track {
            background: rgba(137, 101, 145, 0.2);
        }

        ::-webkit-scrollbar-thumb {
            background: #00abee;
            border-radius: 10px;
        }

        ::-webkit-scrollbar-thumb:hover {
            background: #470250;
        }

    </style>
</head>
<body>
    <div class="inicio">
        <a href="index.html">⬅</a>
    </div>

    <div class="container">
        <h1>Cadastro de Produtos</h1>
        <form>
            <input type="text" placeholder="Digite qual a peça de roupa">
            <input type="number" placeholder="Digite o preço">
            <input type="number" placeholder="Digite a quantidade">
            <textarea placeholder="Descrição do produto"></textarea>
            <input type="submit" value="Cadastrar">
        </form>
    </div>
</body>
</html>
